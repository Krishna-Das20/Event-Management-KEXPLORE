# Render Blueprint for the Encore API (Express 5 + MongoDB Atlas).
# Live service: https://encore-api-ycyn.onrender.com/api/health
# The web app on Vercel calls its own same-origin copy of this API (api/index.js),
# so this service is an independent deployment of the same code.
services:
  - type: web
    name: encore-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --workspace=server --omit=dev
    startCommand: npm start --workspace=server
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - server/**
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CLIENT_URL
        value: https://encore-kexplore.vercel.app
