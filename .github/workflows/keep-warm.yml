name: Keep Render API warm

# Render's free instances sleep after 15 minutes without traffic; a light ping every
# 10 minutes keeps https://encore-api-ycyn.onrender.com responsive.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoints
        run: |
          curl -fsS --max-time 90 --retry 2 https://encore-api-ycyn.onrender.com/api/health
          echo
          curl -fsS --max-time 30 https://encore-kexplore.vercel.app/api/health
