<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Encore — Discover events worth showing up for</title>
    <meta
      name="description"
      content="Encore is a modern event platform to discover concerts, hackathons, workshops, food festivals and more — and register in seconds."
    />
    <meta name="theme-color" content="#08080a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Encore" />
    <meta property="og:title" content="Encore — Discover events worth showing up for" />
    <meta property="og:description" content="Concerts, hackathons, workshops and food festivals across India. Find one, register in seconds." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem('encore.theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Encore needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
